# Projects (v3 ProjectsData.js, field for field). Rendered by templates/projects.html; ids are stable and double as
# deep-link anchors (/projects/#dev-1). Order here is the page order: dev-1 to dev-n, then pm-1 to pm-n, as v3 sorted them.
#
# id           dev-<n> or pm-<n>; the prefix is the filter group
# title        row title; hovering or focusing it shows content
# content      description paragraphs
# tags         all tags; the first visibleTags show, the rest sit behind a +n chip (default 2, as v3's TagCell)
# contentLinks blogPost (a /blog/<file>.md path), caseStudy (a /work/ page), notionEmbed and pdfDocument (open in an
#              overlay), figmaDesign, githubRepo, websiteLink. At most two buttons show, in v3's ButtonGroup order:
#              blog first, then the first of case study, notion, pdf, figma, github, web.

[[projects]]
id = "dev-1"
title = "Journey: High-Performance 2D ECS Engine in Rust"
content = [
  "A handcrafted, cross-platform game engine built from scratch to master systems design. Architected using Rust and wGPU with a custom Entity Component System (ECS) for maximum data locality. Features a fully decoupled rendering pipeline that targets desktop natively and the web via WebAssembly (WASM), delivering consistent 60 FPS performance without a heavy runtime.",
]
tags = ["Rust", "wGPU", "WASM", "ECS", "System Architecture", "Game Dev", "Cross-Platform"]
visibleTags = 3

